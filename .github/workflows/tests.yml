name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Run offline test suite
        env:
          # Offline tests never call OpenAI/Slack; dummy values satisfy imports
          OPENAI_API_KEY: sk-dummy-ci
          SLACK_BOT_TOKEN: ""
        run: python -m pytest tests/ -q
